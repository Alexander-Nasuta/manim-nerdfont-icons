[project]
name = "manim-nerdfont-icons"
version = "1.0.4"
description = "A manim plugin that enables the use of Nerd Fonts icons in manim."
authors = [{name = "Alexander Nasuta", email = "alexander.nasuta@wzl-iqs.rwth-aachen.de"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "manim>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=4.0.1",
    "furo>=2024.8.6",
    "twine>=6.1.0",
    "pyrr>=0.10.3",
    "sphinx-data-viewer>=0.1.5",
    "sphinx-datatables>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manim_nerdfont_icons"]
